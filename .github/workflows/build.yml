name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The compatibility layer is public; build it from source (for compiling only, it is not shipped here) so this mod always compiles against its current API.
      - uses: actions/checkout@v4
        with:
          repository: david568303/Dro2-compatibility-layer
          path: layer

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Filter self-test
        run: dotnet run --project tools/FilterPreview -c Release -- --selftest

      # The game's interop assemblies cannot be published, so compile against the layer's stand-ins that carry the
      # same assembly names and member shapes; the DLLs bind to the real ones inside the game.
      - name: Build compatibility layer
        run: |
          for p in Core/UnityEngine.CoreModule Imgui/UnityEngine.IMGUIModule; do
            dotnet build "layer/ci/UnityStubs/$p.csproj" -c Release -o layer/ci/stubs-out
          done
          dotnet build layer/CarXModManager.csproj -c Release -o layer/out \
            -p:UseBepInExPackages=true \
            -p:GameInteropDirectory="$GITHUB_WORKSPACE/layer/ci/stubs-out"

      - name: Build Map Manager
        run: >
          dotnet build MapManager.csproj -c Release -o out
          -p:SourceRevisionId="$GITHUB_SHA"
          -p:GameInteropDirectory="$GITHUB_WORKSPACE/layer/ci/stubs-out"
          -p:CompatLayerDll="$GITHUB_WORKSPACE/layer/out/CarXModManager.dll"

      # Map Manager only. It needs the compatibility layer at run time, but that is its own mod with its own release.
      - name: Package
        run: |
          mkdir -p package/BepInEx/plugins/MapManager
          cp out/MapManager.dll package/BepInEx/plugins/MapManager/
          (cd package && zip -r ../MapManager.zip BepInEx)

      - uses: actions/upload-artifact@v4
        with:
          name: MapManager
          path: MapManager.zip

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep exactly one release: remove every existing one (and its tag), then publish 0.1-alpha.
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            gh release delete "$tag" --cleanup-tag --yes
          done
          gh release create 0.1-alpha MapManager.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "Map Manager 0.1-alpha" \
            --notes "Dev build from $GITHUB_SHA, not yet tested in-game (compiled against stand-in game assemblies). REQUIRES the compatibility layer: https://github.com/david568303/Dro2-compatibility-layer (install its 0.1-alpha release too). Extract MapManager.zip into the game folder (it contains BepInEx/plugins/MapManager/MapManager.dll). Launch, open a custom map preview, then check BepInEx/LogOutput.log for MAPMANAGER_LOADED and MAPMANAGER_PREVIEW_START / MAPMANAGER_PREVIEW_DONE."
